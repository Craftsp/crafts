<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#111;--muted:#555;--accent:#F0AE00;--line:#d9dce1}
  @media (prefers-color-scheme: dark){:root{--bg:#14161a;--card:#1d2026;--ink:#f2f2f2;--muted:#aab0ba;--line:#333840}}
  *{box-sizing:border-box} html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
  main{max-width:900px;margin:0 auto;padding:28px 16px 56px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
  .logo{display:block;width:min(100%,440px);height:auto;margin:0 auto 18px;border-radius:8px}
  h1{font-size:1.45rem;margin:0 0 8px}
  .sub{margin:0 auto 22px;max-width:56ch;color:var(--muted)}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .btn{display:inline-block;padding:14px 26px;border-radius:10px;font-weight:700;font-size:1rem;text-decoration:none;border:2px solid var(--accent);font-family:inherit}
  .primary{background:var(--accent);color:#111} .ghost{background:transparent;color:var(--ink)}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  details#leitura{margin-top:24px}
  details#leitura>summary{list-style:none;cursor:pointer;background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:16px 20px;font-weight:700;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
  details#leitura>summary::-webkit-details-marker{display:none}
  details#leitura[open]>summary .chev{transform:rotate(180deg)}
  .chev{transition:transform .2s}
  details#leitura>summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  details#leitura .hint{margin:14px 0}
  .hint{color:var(--muted);font-size:.9rem;margin:0 0 14px}
  .pg{display:block;width:100%;height:auto;margin:0 auto 14px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .top{position:fixed;right:16px;bottom:16px;background:var(--accent);color:#111;border-radius:999px;padding:10px 16px;font-weight:700;text-decoration:none;font-size:.9rem}
</style>
